{% extends "base.html" %}
{% block content %}
<div class="heading"><div><h1>Nueva venta</h1><p class="muted">Introduce los datos del cliente.</p></div></div>
<form method="post" class="panel form-grid">
<h2 class="full">Datos del cliente</h2>
<label>Nombres completos*<input name="full_name" value="{{ data.get('full_name','') }}" required></label>
<label>DNI*<input name="dni" value="{{ data.get('dni','') }}" required></label>
<label>Móvil<input name="mobile" value="{{ data.get('mobile','') }}"></label>
<label>Fijo<input name="fixed_phone" value="{{ data.get('fixed_phone','') }}"></label>
<label>Correo<input type="email" name="email" value="{{ data.get('email','') }}"></label>
<label>IBAN<input name="iban" value="{{ data.get('iban','') }}"></label>
<label class="full">Dirección completa<input name="address" value="{{ data.get('address','') }}"></label>
<label>Código postal<input name="postal_code" value="{{ data.get('postal_code','') }}"></label>
<label>Población<input name="population" value="{{ data.get('population','') }}"></label>
<label>Provincia<input name="province" value="{{ data.get('province','') }}"></label>
<label>CUPS de luz<input name="cups_light" value="{{ data.get('cups_light','') }}"></label>
<label>CUPS de gas<input name="cups_gas" value="{{ data.get('cups_gas','') }}"></label>
<label>Compañía*<select name="company" required>{% for c in companies %}<option {% if data.get('company')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label>
<label>Producto*<select name="product" required>{% for p in products %}<option {% if data.get('product')==p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label>
<div class="full actions"><button>GUARDAR VENTA</button><a class="button secondary" href="{{ url_for('dashboard') }}">Cancelar</a></div>
</form>
{% endblock %}
